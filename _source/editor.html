<title>PrivexBot — Post Editor</title>

<style>
  html, body { margin: 0; height: 100%; background: #0F1218; }
  body { font-family: 'Inter', system-ui, sans-serif; color: #F3F4F7; -webkit-font-smoothing: antialiased; }
  #root { min-height: 100vh; }

  .editor {
    display: grid;
    grid-template-columns: 280px 1fr 340px;
    height: 100vh;
    overflow: hidden;
  }

  /* Left: template picker */
  .picker {
    background: #0A0C10;
    border-right: 1px solid #1E2230;
    padding: 24px 20px;
    overflow-y: auto;
  }
  .picker h1 {
    font-family: 'Inter Tight', sans-serif;
    font-size: 18px;
    font-weight: 800;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
    display: flex; align-items: center; gap: 10px;
  }
  .picker .tagline { font-size: 12px; color: #858C9D; margin: 0 0 24px; }
  .picker .group-label {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 700;
    color: #5A6172;
    margin: 18px 6px 8px;
  }
  .picker .tmpl-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 12px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: 8px;
    color: #D9DCE3;
    font-size: 13px;
    cursor: pointer;
    text-align: left;
    font-family: inherit;
    transition: all 120ms cubic-bezier(0.2,0.7,0.2,1);
  }
  .picker .tmpl-btn:hover { background: rgba(255,255,255,0.04); color: #fff; }
  .picker .tmpl-btn.active {
    background: rgba(57,71,168,0.18);
    border-color: rgba(136,146,216,0.4);
    color: #fff;
  }
  .picker .tmpl-btn .dot {
    width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0;
  }

  /* Center: canvas */
  .stage {
    background: #161A22;
    background-image: radial-gradient(circle, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 24px 24px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .stage-meta {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(12px);
    border: 1px solid #1E2230;
    border-radius: 999px;
    padding: 8px 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #B4BAC6;
    letter-spacing: 0.04em;
    z-index: 10;
    display: flex; align-items: center; gap: 12px;
  }
  .stage-meta .live-dot {
    width: 6px; height: 6px; border-radius: 999px; background: #7DC79A;
    box-shadow: 0 0 8px #7DC79A;
  }
  .artboard-wrap {
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04);
    border-radius: 6px;
    overflow: hidden;
  }

  /* Right: controls */
  .controls {
    background: #0A0C10;
    border-left: 1px solid #1E2230;
    padding: 24px 20px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 16px;
  }
  .controls h2 {
    font-family: 'Inter Tight', sans-serif;
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    color: #fff;
  }
  .controls .sub { font-size: 12px; color: #858C9D; margin: -8px 0 4px; }
  .ctrl-group { display: flex; flex-direction: column; gap: 8px; }
  .ctrl-label {
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    font-weight: 700;
    color: #5A6172;
  }
  .ctrl input, .ctrl textarea, .ctrl select {
    width: 100%;
    padding: 10px 12px;
    background: #161A22;
    border: 1px solid #1E2230;
    border-radius: 8px;
    color: #F3F4F7;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    transition: border-color 120ms;
    box-sizing: border-box;
  }
  .ctrl input:focus, .ctrl textarea:focus, .ctrl select:focus {
    outline: none;
    border-color: #5866C2;
    box-shadow: 0 0 0 3px rgba(57,71,168,0.3);
  }
  .ctrl textarea { resize: vertical; min-height: 64px; font-family: inherit; }

  .swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .swatch {
    aspect-ratio: 1;
    border-radius: 8px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 120ms;
    position: relative;
  }
  .swatch.active { border-color: #fff; }
  .swatch:hover { transform: scale(1.05); }

  .export-btn {
    width: 100%;
    padding: 14px 16px;
    background: #fff;
    color: #0A0C10;
    border: none;
    border-radius: 10px;
    font-family: 'Inter Tight', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: all 120ms cubic-bezier(0.2,0.7,0.2,1);
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .export-btn:hover { background: #B6BEEA; }
  .export-btn:active { transform: translateY(1px); }
  .export-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .kit-link {
    display: flex; align-items: center; gap: 8px;
    color: #858C9D;
    text-decoration: none;
    font-size: 12px;
    padding: 8px 0;
    border-top: 1px solid #1E2230;
    margin-top: 12px;
  }
  .kit-link:hover { color: #fff; }

  /* Scaling for stage */
  .scale-wrap { transform-origin: center; transition: transform 200ms cubic-bezier(0.2,0.7,0.2,1); }

function App() {
  const [activeId, setActiveId] = useState(TEMPLATES[0].id);
  const [content, setContent] = useState(() => {
    // build defaults map keyed by template id
    const map = {};
    TEMPLATES.forEach((t) => {
      map[t.id] = {};
      (t.fields || []).forEach((f) => { map[t.id][f.k] = f.def; });
    });
    return map;
  });
  const [exporting, setExporting] = useState(false);
  const artboardRef = useRef(null);
  const stageRef = useRef(null);
  const [scale, setScale] = useState(0.5);

  const tpl = TEMPLATES.find((t) => t.id === activeId);
  const Component = tpl?.Component;
  const props = content[activeId] || {};

  // Fit-to-screen scale calc
  useEffect(() => {
    if (!stageRef.current || !tpl) return;
    const calc = () => {
      const stage = stageRef.current;
      if (!stage) return;
      const padding = 80;
      const availW = stage.clientWidth - padding * 2;
      const availH = stage.clientHeight - padding * 2;
      const s = Math.min(availW / tpl.w, availH / tpl.h, 1);
      setScale(s);
    };
    calc();
    const ro = new ResizeObserver(calc);
    ro.observe(stageRef.current);
    return () => ro.disconnect();
  }, [activeId, tpl]);

  // group templates by group
  const grouped = useMemo(() => {
    const g = {};
    TEMPLATES.forEach((t) => {
      g[t.group] = g[t.group] || [];
      g[t.group].push(t);
    });
    return g;
  }, []);

  const updateField = (k, v) => {
    setContent((c) => ({ ...c, [activeId]: { ...c[activeId], [k]: v } }));
  };

  const exportPng = async () => {
    if (!artboardRef.current || !window.htmlToImage) return;
    setExporting(true);
    try {
      const node = artboardRef.current.querySelector('.artboard-export');
      if (!node) return;
      // Temporarily reset transform for capture
      const dataUrl = await window.htmlToImage.toPng(node, {
        pixelRatio: 1,
        cacheBust: true,
        width: tpl.w,
        height: tpl.h,
      });
      const link = document.createElement('a');
      link.download = `privexbot-${tpl.id}-${Date.now()}.png`;
      link.href = dataUrl;
      link.click();
    } catch (e) {
      console.error('Export failed', e);
      alert('Export failed: ' + e.message);
    } finally {
      setExporting(false);
    }
  };

  return (
    <div className="editor">
      {/* Picker */}
      <aside className="picker">
        <h1>
          <Icon color="white" size={22} />
          <span>Post editor</span>
        </h1>
        <p className="tagline">Pick a template. Edit text. Export PNG.</p>

        {Object.entries(grouped).map(([group, items]) => (
          <div key={group}>
            <div className="group-label">{group}</div>
            {items.map((t) => (
              <button
                key={t.id}
                className={`tmpl-btn ${activeId === t.id ? 'active' : ''}`}
                onClick={() => setActiveId(t.id)}
              >
                <span className="dot" style={{ background: t.dot }} />
                <span>{t.name}</span>
              </button>
            ))}
          </div>
        ))}

        <a className="kit-link" href="index.html">
          ← Back to full brand kit
        </a>
      </aside>

      {/* Stage */}
      <div className="stage" ref={stageRef}>
        <div className="stage-meta">
          <span className="live-dot"></span>
          <span>{tpl.name}</span>
          <span style={{ color: '#5A6172' }}>·</span>
          <span style={{ color: '#5A6172' }}>{tpl.w} × {tpl.h}</span>
          <span style={{ color: '#5A6172' }}>·</span>
          <span style={{ color: '#5A6172' }}>{Math.round(scale * 100)}%</span>
        </div>
        <div ref={artboardRef} style={{ width: tpl.w * scale, height: tpl.h * scale, position: 'relative' }}>
          <div
            className="artboard-export"
            style={{
              width: tpl.w,
              height: tpl.h,
              transform: `scale(${scale})`,
              transformOrigin: 'top left',
              position: 'absolute',
              top: 0,
              left: 0,
            }}
          >
            {Component && <Component {...props} />}
          </div>
        </div>
      </div>

      {/* Controls */}
      <aside className="controls">
        <h2>Edit</h2>
        <p className="sub">Changes preview live. Export at full {tpl.w}×{tpl.h}.</p>

        {(tpl.fields || []).length === 0 && (
          <div style={{ padding: '20px 16px', background: '#161A22', border: '1px solid #1E2230', borderRadius: 10, fontSize: 12, color: '#858C9D', lineHeight: 1.5 }}>
            This template ships fixed — duplicate it from the brand kit if you want to edit the markup.
          </div>
        )}

        {(tpl.fields || []).map((f) => (
          <div key={f.k} className="ctrl ctrl-group">
            <div className="ctrl-label">{f.label}</div>
            {f.type === 'textarea' ? (
              <textarea
                rows={3}
                value={props[f.k] ?? ''}
                onChange={(e) => updateField(f.k, e.target.value)}
              />
            ) : (
              <input
                type="text"
                value={props[f.k] ?? ''}
                onChange={(e) => updateField(f.k, e.target.value)}
              />
            )}
          </div>
        ))}

        <button className="export-btn" onClick={exportPng} disabled={exporting}>
          {exporting ? 'Exporting…' : (
            <>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              Export PNG
            </>
          )}
        </button>
      </aside>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
